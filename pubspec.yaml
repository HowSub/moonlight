name: login
description: "Login UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  go_router: ^17.3.0
  firebase_core: ^4.12.1
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# APP ICON

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon.jpg'

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: StackSans
      fonts:
        - asset: assets/fonts/StackSans.ttf

