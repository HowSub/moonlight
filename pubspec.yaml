name: moonlight
description: "App for observing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  go_router: ^17.3.0
  firebase_core: ^4.12.1
  flutter_native_splash: ^2.4.8
  firebase_auth: ^6.5.6
  intl: ^0.20.3
  moon_phase: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# APP ICON

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon.jpg'

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/moon_phases/
    - assets/images/weekly_news/
    - assets/images/weekly_weather_forecast/
    - assets/images/profile_images/

  fonts:
    - family: StackSans
      fonts:
        - asset: assets/fonts/StackSans.ttf

